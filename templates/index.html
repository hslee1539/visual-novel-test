<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <h1>{{ title }}</h1>
      <p class="subtitle">짱구와 친구들이 만들어가는 소풍 대소동</p>
    </header>
    <main class="layout">
      <section class="scene" id="scene" aria-live="polite">
        <div class="scene__background" id="background"></div>
        <div class="scene__content">
          <p class="scene__speaker" id="speaker"></p>
          <p class="scene__dialogue" id="dialogue"></p>
        </div>
      </section>
      <aside class="sidebar">
        <div class="choices">
          <h2>선택지</h2>
          <div id="choices"></div>
        </div>
        <div class="history">
          <h2>기록</h2>
          <ul id="history"></ul>
        </div>
      </aside>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
