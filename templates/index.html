<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <h1>{{ title }}</h1>
      <p class="subtitle">짱구와 친구들이 만들어가는 소풍 대소동</p>
    </header>
    <main class="layout">
      <section class="scene" id="scene" aria-live="polite">
        <div class="scene__background" id="background"></div>
        <div class="scene__content">
          <p class="scene__speaker" id="speaker"></p>
          <p class="scene__dialogue" id="dialogue"></p>
          <div class="scene__prompt" aria-live="polite">
            <p class="scene__prompt-label">디퓨전 프롬프트</p>
            <p class="scene__prompt-text" id="prompt"></p>
          </div>
        </div>
      </section>
      <aside class="sidebar">
        <div class="choices">
          <h2>선택지</h2>
          <div id="choices"></div>
        </div>
        <div class="history">
          <h2>기록</h2>
          <ul id="history"></ul>
        </div>
        <div class="llm-box">
          <h2>LM Studio 제안</h2>
          <p class="llm-description">
            장면 아이디어나 대사를 입력하면 LM Studio가 새로운 문장을 만들어줘요.
            로컬에서 실행 중인 모델과 연결됩니다.
          </p>
          <form id="llmForm" class="llm-form">
            <label for="llmPrompt" class="sr-only">프롬프트 입력</label>
            <textarea
              id="llmPrompt"
              name="prompt"
              rows="3"
              placeholder="예) 짱구가 도시락을 자랑하는 장면을 더 생생하게 써 줘"
              required
            ></textarea>
            <button type="submit" id="llmSubmit">LM Studio에게 요청하기</button>
          </form>
          <p class="llm-status" id="llmStatus" aria-live="polite"></p>
          <div class="llm-result" id="llmResult" aria-live="polite"></div>
        </div>
      </aside>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
